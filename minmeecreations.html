<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min Mee Creations | Unified Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #b89655; --black: #121212; --white: #ffffff; --ivory: #fcfaf7; --danger: #e74c3c; --success: #27ae60; }
        body { font-family: 'Montserrat', sans-serif; margin: 0; background-color: var(--ivory); color: var(--black); scroll-behavior: smooth; }
        h1, h2, h3, .logo { font-family: 'Playfair Display', serif; }
        nav { background: var(--black); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; }
        .admin-trigger { color: var(--gold) !important; font-weight: bold; cursor: pointer; }
        section { padding: 80px 8%; border-bottom: 1px solid #eee; }
        .hidden { display: none; }
        .lookbook-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .lookbook-item { position: relative; height: 400px; overflow: hidden; background: #000; cursor: pointer; }
        .lookbook-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; transition: 0.5s; }
        .lookbook-item:hover .lookbook-img { transform: scale(1.1); opacity: 0.6; }
        .lookbook-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; opacity: 0; transition: 0.5s; }
        .lookbook-item:hover .lookbook-overlay { opacity: 1; }
        .admin-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.85rem; }
        th { text-align: left; padding: 15px; background: #f9f9f9; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #eee; }
        #chat-widget { position: fixed; bottom: 30px; right: 30px; width: 320px; background: white; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); overflow: hidden; z-index: 2000; display: none; }
        .chat-header { background: var(--black); color: var(--gold); padding: 15px; display: flex; justify-content: space-between; }
        .btn { padding: 12px 25px; border: none; cursor: pointer; text-transform: uppercase; font-weight: 600; font-size: 0.7rem; }
        .btn-gold { background: var(--gold); color: white; }
        .btn-black { background: var(--black); color: var(--gold); }
        #alertBar { background: var(--danger); color: white; padding: 10px; text-align: center; display: none; font-weight: bold; position: sticky; top: 60px; z-index: 999; }
    </style>
</head>
<body>

    <div id="alertBar">⚠️ NEW URGENT CALLBACK REQUESTED</div>

    <nav>
        <div class="logo" style="color:white; letter-spacing: 5px;">MIN MEE</div>
        <div class="nav-links">
            <a href="#boutique">Boutique</a>
            <a href="#lookbook">Lookbook</a>
            <a class="admin-trigger" onclick="toggleAdmin()">Executive Login</a>
        </div>
    </nav>

    <section id="boutique">
        <div style="text-align: center; margin-bottom: 50px;">
            <h2>The Skincare Rituals</h2>
            <p>Mastercard & Visa Accepted</p>
        </div>
        <div class="lookbook-grid" id="productGrid"></div>
    </section>

    <section id="lookbook">
        <div style="text-align: center; margin-bottom: 50px;"><h2>Ritual Lookbook</h2></div>
        <div class="lookbook-grid">
            <div class="lookbook-item">
                <img src="https://images.unsplash.com/photo-1556228720-195a672e8a03?auto=format&fit=crop&w=800" class="lookbook-img">
                <div class="lookbook-overlay"><h3>Morning Glow</h3><button class="btn btn-gold" onclick="processPayment('Radiance Essence', 9500)">Shop Look</button></div>
            </div>
            <div class="lookbook-item">
                <img src="https://images.unsplash.com/photo-1512496015851-a90fb38ba796?auto=format&fit=crop&w=800" class="lookbook-img">
                <div class="lookbook-overlay"><h3>Night Restoration</h3><button class="btn btn-gold" onclick="processPayment('Ginseng Serum', 18500)">Shop Look</button></div>
            </div>
        </div>
    </section>

    <section id="adminPanel" class="hidden" style="background: #f4f4f4;">
        <h2 style="text-align: center; margin-bottom: 40px;">Executive Command Center</h2>
        <div class="admin-card">
            <h3>Profit & CRM Ledger</h3>
            <div id="profitSummary"></div>
            <table>
                <thead><tr><th>Client</th><th>Tier</th><th>Notes</th></tr></thead>
                <tbody id="crmBody">
                    <tr><td><strong>Anjali P.</strong></td><td><span style="color: var(--gold);">PLATINUM</span></td><td><textarea style="width:100%;">Sensitive skin; likes Ginseng.</textarea></td></tr>
                </tbody>
            </table>
        </div>
    </section>

    <div id="chat-widget">
        <div class="chat-header"><span>Concierge Support</span><span onclick="toggleChat()" style="cursor:pointer;">&times;</span></div>
        <div style="padding: 20px;" id="chatContent">
            <input type="text" id="cbName" placeholder="Name" style="width:100%; padding:10px; margin-bottom:10px;">
            <input type="text" id="cbPhone" placeholder="07X XXXXXXX" style="width:100%; padding:10px; margin-bottom:10px;">
            <button class="btn btn-black" onclick="requestCallback()">Request Call</button>
        </div>
    </div>
    <div onclick="toggleChat()" style="position:fixed; bottom:30px; right:30px; background:var(--black); color:var(--gold); width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:1.5rem; z-index:1001;">📞</div>

    <script>
        const products = [
            { name: "Radiance Essence", price: 9500, stock: 5 },
            { name: "Gold Ginseng Serum", price: 18500, stock: 0 },
            { name: "Silk Cleansing Balm", price: 6200, stock: 10 }
        ];

        function renderBoutique() {
            document.getElementById('productGrid').innerHTML = products.map(p => `
                <div class="admin-card" style="text-align:center;">
                    <small style="color:${p.stock > 0 ? 'green' : 'orange'}">${p.stock > 0 ? '● In Stock' : '● Arriving Soon'}</small>
                    <h3>${p.name}</h3><p>Rs. ${p.price.toLocaleString()}</p>
                    ${p.stock > 0 ? `<button class="btn btn-black" onclick="processPayment('${p.name}', ${p.price})">Buy Now</button>` : `<button class="btn btn-gold" onclick="toggleChat()">Join Waitlist</button>`}
                </div>`).join('');
        }

        function toggleAdmin() {
            const accessCode = "MINMEE2026"; 
            const userInput = prompt("Executive Access Required:");
            if (userInput === accessCode) {
                document.getElementById('adminPanel').classList.toggle('hidden');
                window.location.hash = "adminPanel";
            } else { alert("Denied."); }
        }

        function toggleChat() { 
            const chat = document.getElementById('chat-widget');
            chat.style.display = (chat.style.display === 'block') ? 'none' : 'block'; 
        }

        function requestCallback() {
            document.getElementById('alertBar').style.display = 'block';
            document.getElementById('chatContent').innerHTML = "<h4>Request Sent to Owner.</h4>";
        }

        function processPayment(item, price) {
            if(confirm(`Confirm Rs. ${price.toLocaleString()} via Mastercard/Visa?`)) {
                alert("Thank you. Invoice downloading...");
                const blob = new Blob([`MIN MEE INVOICE\nOrder: ${item}\nAmount: Rs. ${price}\nStatus: PAID`], {type: 'text/plain'});
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = "MinMee_Invoice.txt";
                link.click();
            }
        }
        renderBoutique();
    </script>
</body>
</html>
